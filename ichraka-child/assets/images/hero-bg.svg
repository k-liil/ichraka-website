<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="sun" cx="50%" cy="100%" r="80%">
            <stop offset="0%" stop-color="#FFA640" stop-opacity="0.6"/>
            <stop offset="60%" stop-color="#E8780A" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#E8780A" stop-opacity="0"/>
        </radialGradient>
        <pattern id="rays" x="600" y="800" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(0 600 800)">
            <line x1="50" y1="0" x2="50" y2="100" stroke="#E8780A" stroke-opacity="0.08" stroke-width="2"/>
        </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#sun)"/>
    <g transform="translate(600,800)" opacity="0.5">
        <g stroke="#E8780A" stroke-width="3" stroke-linecap="round" opacity="0.25">
            <line x1="0" y1="0" x2="0" y2="-700"/>
            <line x1="0" y1="0" x2="-200" y2="-680" transform="rotate(-15)"/>
            <line x1="0" y1="0" x2="200" y2="-680" transform="rotate(15)"/>
            <line x1="0" y1="0" x2="-400" y2="-580" transform="rotate(-30)"/>
            <line x1="0" y1="0" x2="400" y2="-580" transform="rotate(30)"/>
            <line x1="0" y1="0" x2="-560" y2="-420" transform="rotate(-45)"/>
            <line x1="0" y1="0" x2="560" y2="-420" transform="rotate(45)"/>
            <line x1="0" y1="0" x2="-680" y2="-200" transform="rotate(-60)"/>
            <line x1="0" y1="0" x2="680" y2="-200" transform="rotate(60)"/>
        </g>
        <circle cx="0" cy="0" r="200" fill="#E8780A" opacity="0.2"/>
        <circle cx="0" cy="0" r="120" fill="#FFA640" opacity="0.4"/>
    </g>
</svg>
